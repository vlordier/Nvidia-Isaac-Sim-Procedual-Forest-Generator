[project]
name = "genesis-forest"
version = "0.1.0"
description = "Procedural forest generator: Genesis Physics + OpenUSD + usdrecord video rendering"
requires-python = ">=3.12"
dependencies = [
    "genesis-world>=0.4.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "noise",
    "torch",
]

[project.optional-dependencies]
video = [
    "trimesh>=4.0",
    "usd-core",
]
gradio = [
    "gradio>=4.0.0",
]
dev = [
    "pytest",
    "ruff",
]
all = [
    "trimesh>=4.0",
    "usd-core",
    "gradio>=4.0.0",
    "pytest",
    "ruff",
]

[project.scripts]
forest-generate = "genesis_forest.examples.simple_forest:main"
forest-video = "genesis_forest.examples.forest_video:main"
forest-gradio = "genesis_forest.gradio_app.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genesis_forest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
