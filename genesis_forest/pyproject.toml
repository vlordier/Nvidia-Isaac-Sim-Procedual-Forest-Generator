[project]
name = "genesis-forest"
version = "0.1.0"
description = "Procedural forest generator: OpenUSD + Genesis Physics + Gradio + UE5"
requires-python = ">=3.10,<3.14"
dependencies = [
    "genesis-world>=0.4.0",
    "gradio>=4.0.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "noise",
    "torch",
]

[project.optional-dependencies]
usd = [
    "usd-core",  # Pixar USD (pxr) - no NVIDIA dependency
]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "gradio_app", "ue5", "examples"]

[tool.ruff]
line-length = 100
target-version = "py310"
